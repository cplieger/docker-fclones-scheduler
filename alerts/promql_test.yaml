# promtool test rules alerts/promql_test.yaml
rule_files:
  - promql.yaml

evaluation_interval: 1m

tests:
  - name: a failing scrape pages after 5m and keeps the target's labels
    interval: 1m
    input_series:
      - series: 'up{job="fclones", instance="fc:9469"}'
        values: "1 0x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: FclonesDown
        exp_alerts: []
      - eval_time: 8m
        alertname: FclonesDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: fclones
              instance: fc:9469
            exp_annotations:
              summary: "docker-fclones-scheduler is not being scraped"
              description: "No successful scrape for 5m: the container is stopped, crash-looping or refusing to start, or the scrape cannot reach METRICS_LISTEN_ADDR. Check the container's state and its last ERROR line.\n"

  - name: a target that is gone pages through the absent arm
    interval: 1m
    input_series:
      - series: 'up{job="other", instance="x:1"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: FclonesDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: fclones
            exp_annotations:
              summary: "docker-fclones-scheduler is not being scraped"
              description: "No successful scrape for 5m: the container is stopped, crash-looping or refusing to start, or the scrape cannot reach METRICS_LISTEN_ADDR. Check the container's state and its last ERROR line.\n"

  - name: FclonesRunFailed holds while the last run failed and clears at the next good run
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_last_run_ok{job="fclones", instance="fc:9469"}'
        values: "1 0x4 1x4"
      - series: 'fclones_scheduler_last_run_timestamp_seconds{job="fclones", instance="fc:9469"}'
        values: "60+60x9"
    alert_rule_test:
      - eval_time: 0m
        alertname: FclonesRunFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: FclonesRunFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: fclones
              instance: fc:9469
            exp_annotations:
              summary: "The last fclones run failed, so no space was reclaimed"
              description: "The latest completed run failed. fclones_scheduler_last_run_result names the cause, and the run's ERROR line has the detail. For action_no_op, check the container can write to the scanned folders and, for dedupe, that the filesystem supports reflinks.\n"
      - eval_time: 7m
        alertname: FclonesRunFailed
        exp_alerts: []

  - name: a fresh install that has not finished a run yet is not a failed run
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_last_run_ok{job="fclones", instance="fc:9469"}'
        values: "0x10"
      - series: 'fclones_scheduler_last_run_timestamp_seconds{job="fclones", instance="fc:9469"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: FclonesRunFailed
        exp_alerts: []

  - name: FclonesScanStalled fires 15m past the run deadline even while failed runs keep ending, and resolves at a success
    interval: 1m
    input_series:
      # Due at 1h, so the arm reads past 1h15m and fires 15m later; a success at 100m moves it.
      - series: 'fclones_scheduler_run_deadline_timestamp_seconds{job="fclones", instance="fc:9469"}'
        values: "3600x99 100000x10"
      - series: 'fclones_scheduler_last_run_timestamp_seconds{job="fclones", instance="fc:9469"}'
        values: "60+60x109"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x109"
    alert_rule_test:
      - eval_time: 74m
        alertname: FclonesScanStalled
        exp_alerts: []
      - eval_time: 95m
        alertname: FclonesScanStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              job: fclones
              instance: fc:9469
            exp_annotations:
              summary: "fclones runs are overdue"
              description: "No run succeeded by the deadline, or, with deadline 0, none finished in 30h. Failing runs cross it too: check FclonesRunFailed first. Otherwise suspect a stuck schedule or phase, no outside trigger, or another container holding the scan lock.\n"
      - eval_time: 101m
        alertname: FclonesScanStalled
        exp_alerts: []

  - name: FclonesScanStalled ignores the 30h window while the run deadline is ahead
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_run_deadline_timestamp_seconds{job="fclones", instance="fc:9469"}'
        values: "10000000000x2000"
      - series: 'fclones_scheduler_last_run_timestamp_seconds{job="fclones", instance="fc:9469"}'
        values: "1x2000"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x2000"
    alert_rule_test:
      - eval_time: 31h
        alertname: FclonesScanStalled
        exp_alerts: []

  - name: FclonesScanStalled with no deadline fires 30h after the last run, after its 15m for, and clears at the next run
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_run_deadline_timestamp_seconds{job="fclones", instance="fc:9469"}'
        values: "0x2000"
      - series: 'fclones_scheduler_last_run_timestamp_seconds{job="fclones", instance="fc:9469"}'
        values: "1x1820 200000x179"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x2000"
    alert_rule_test:
      - eval_time: 30h10m
        alertname: FclonesScanStalled
        exp_alerts: []
      - eval_time: 30h17m
        alertname: FclonesScanStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              job: fclones
              instance: fc:9469
            exp_annotations:
              summary: "fclones runs are overdue"
              description: "No run succeeded by the deadline, or, with deadline 0, none finished in 30h. Failing runs cross it too: check FclonesRunFailed first. Otherwise suspect a stuck schedule or phase, no outside trigger, or another container holding the scan lock.\n"
      - eval_time: 30h25m
        alertname: FclonesScanStalled
        exp_alerts: []

  - name: FclonesScanStalled with no deadline measures from the process start before the first run
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_run_deadline_timestamp_seconds{job="fclones", instance="fc:9469"}'
        values: "0x2000"
      - series: 'fclones_scheduler_last_run_timestamp_seconds{job="fclones", instance="fc:9469"}'
        values: "0x2000"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x2000"
    alert_rule_test:
      - eval_time: 30h10m
        alertname: FclonesScanStalled
        exp_alerts: []
      - eval_time: 30h17m
        alertname: FclonesScanStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              job: fclones
              instance: fc:9469
            exp_annotations:
              summary: "fclones runs are overdue"
              description: "No run succeeded by the deadline, or, with deadline 0, none finished in 30h. Failing runs cross it too: check FclonesRunFailed first. Otherwise suspect a stuck schedule or phase, no outside trigger, or another container holding the scan lock.\n"

  - name: a deadline of 0 never fires the deadline arm, with a run every 3h, the default interval
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_run_deadline_timestamp_seconds{job="fclones", instance="fc:9469"}'
        values: "0x2519"
      - series: 'fclones_scheduler_last_run_timestamp_seconds{job="fclones", instance="fc:9469"}'
        values: "1x179 10801x179 21601x179 32401x179 43201x179 54001x179 64801x179 75601x179 86401x179 97201x179 108001x179 118801x179 129601x179 140401x179"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x2519"
    alert_rule_test:
      - eval_time: 15m
        alertname: FclonesScanStalled
        exp_alerts: []
      - eval_time: 31h
        alertname: FclonesScanStalled
        exp_alerts: []
      - eval_time: 41h
        alertname: FclonesScanStalled
        exp_alerts: []

  - name: FclonesFormatDrift holds while the last summary was not recognized and clears at the next recognized one
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_action_summary_recognized{job="fclones", instance="fc:9469"}'
        values: "1 0x4 1x4"
    alert_rule_test:
      - eval_time: 0m
        alertname: FclonesFormatDrift
        exp_alerts: []
      - eval_time: 2m
        alertname: FclonesFormatDrift
        exp_alerts:
          - exp_labels:
              severity: warning
              job: fclones
              instance: fc:9469
            exp_annotations:
              summary: "fclones printed an action summary the container does not recognize"
              description: "The latest action's summary was not recognized, so the files and bytes reclaimed read zero after real work. The run still succeeds. A --dry-run in FCLONES_ACTION_ARGS causes this by design. Otherwise check the fclones version.\n"
      - eval_time: 7m
        alertname: FclonesFormatDrift
        exp_alerts: []

  - name: FclonesSpaceReclaimed carries the file count in its value, never a label
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_files_processed_total{job="fclones", instance="fc:9469"}'
        values: "0 0 2x5"
    alert_rule_test:
      - eval_time: 1m
        alertname: FclonesSpaceReclaimed
        exp_alerts: []
      - eval_time: 5m
        alertname: FclonesSpaceReclaimed
        exp_alerts:
          - exp_labels:
              severity: info
              job: fclones
              instance: fc:9469
            exp_annotations:
              summary: "fclones processed 2 duplicate files in the last 30h"
              description: "Runs in the last 30h linked, removed or deduplicated about 2 duplicate files. fclones_scheduler_reclaimed_bytes_total gives the space freed. This is a success notice and needs no action.\n"

  - name: runs that processed no files send no reclaim notice
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_files_processed_total{job="fclones", instance="fc:9469"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: FclonesSpaceReclaimed
        exp_alerts: []

  # The dashboard's fclones Scheduler scrape tile, with $instance filled in as an IPv6 target.
  # TestDashboardQueriesAreTheTestedOnes fails when the two differ.
  - name: "Scrape tile: a down IPv6 target shows its tile"
    interval: 1m
    input_series:
      - series: 'up{job="fclones", instance="[::1]:9469"}'
        values: "0x10"
    promql_expr_test:
      - expr: &down_tile '0 * max((ALERTS{alertname="FclonesDown", alertstate="firing", instance="[::1]:9469"} or ALERTS{alertname="FclonesDown", alertstate="firing", instance=""}))'
        eval_time: 8m
        exp_samples:
          - labels: '{}'
            value: 0
  - name: "Scrape tile: a gone target shows the tile, through the alert with no instance"
    interval: 1m
    input_series:
      - series: 'up{job="other", instance="x:1"}'
        values: "1x10"
    promql_expr_test:
      - expr: *down_tile
        eval_time: 8m
        exp_samples:
          - labels: '{}'
            value: 0
  - name: "Scrape tile: a down neighbour whose name the picked IPv6 target matches as a pattern leaves it hidden"
    interval: 1m
    input_series:
      - series: 'up{job="fclones", instance="[::1]:9469"}'
        values: "1x10"
      - series: 'up{job="fclones", instance="1:9469"}'
        values: "0x10"
    promql_expr_test:
      - expr: *down_tile
        eval_time: 8m
        exp_samples: []

  # The dashboard's Space freed query, with $instance and its 5m slot filled in.
  # TestDashboardQueriesAreTheTestedOnes fails when the two differ.
  - name: "Space freed: a slot counts the bytes freed in it, on the picked instance only"
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_reclaimed_bytes_total{job="fclones", instance="fc:9469"}'
        values: "0+1000x30"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x30"
      - series: 'fclones_scheduler_reclaimed_bytes_total{job="fclones", instance="other:9469"}'
        values: "0+7x30"
      - series: 'process_start_time_seconds{job="fclones", instance="other:9469"}'
        values: "0x30"
    promql_expr_test:
      - expr: &space_freed 'round(sum by (instance) (((last_over_time(fclones_scheduler_reclaimed_bytes_total{instance="fc:9469"}[5m]) - last_over_time(fclones_scheduler_reclaimed_bytes_total{instance="fc:9469"}[5m] offset 5m)) unless on (instance) ((last_over_time(process_start_time_seconds{instance="fc:9469"}[5m]) != last_over_time(process_start_time_seconds{instance="fc:9469"}[5m] offset 5m)) or (last_over_time(process_start_time_seconds{instance="fc:9469"}[5m]) > time() - 300000 / 1000))) or (last_over_time(fclones_scheduler_reclaimed_bytes_total{instance="fc:9469"}[5m]) and on (instance) ((last_over_time(process_start_time_seconds{instance="fc:9469"}[5m]) != last_over_time(process_start_time_seconds{instance="fc:9469"}[5m] offset 5m)) or (last_over_time(process_start_time_seconds{instance="fc:9469"}[5m]) > time() - 300000 / 1000))) or (last_over_time(fclones_scheduler_reclaimed_bytes_total{instance="fc:9469"}[5m]) - min_over_time(fclones_scheduler_reclaimed_bytes_total{instance="fc:9469"}[5m]))))'
        eval_time: 20m
        exp_samples:
          - labels: '{instance="fc:9469"}'
            value: 5000
  - name: "Space freed: a slot that freed nothing reads 0, not a gap"
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_reclaimed_bytes_total{job="fclones", instance="fc:9469"}'
        values: "5000x40"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x40"
    promql_expr_test:
      - expr: *space_freed
        eval_time: 30m
        exp_samples:
          - labels: '{instance="fc:9469"}'
            value: 0
  - name: "Space freed: a restart counts the bytes its first run freed even when the new total matches the old one"
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_reclaimed_bytes_total{job="fclones", instance="fc:9469"}'
        values: "1000x29 1000x20"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x29 1770x20"
    promql_expr_test:
      - expr: *space_freed
        eval_time: 34m
        exp_samples:
          - labels: '{instance="fc:9469"}'
            value: 1000
  - name: "Space freed: a restart counts the new total, not the drop from the old one"
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_reclaimed_bytes_total{job="fclones", instance="fc:9469"}'
        values: "3000x29 0 2000 3000 4000x20"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x29 1770x20"
    promql_expr_test:
      - expr: *space_freed
        eval_time: 34m
        exp_samples:
          - labels: '{instance="fc:9469"}'
            value: 4000
  - name: "Space freed: a failed scrape at the slot end still counts the slot, and the next slot reads 0"
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_reclaimed_bytes_total{job="fclones", instance="fc:9469"}'
        values: "0x15 1000x3 stale 1000x10"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x18 stale 0x10"
    promql_expr_test:
      - expr: *space_freed
        eval_time: 20m
        exp_samples:
          - labels: '{instance="fc:9469"}'
            value: 1000
      - expr: *space_freed
        eval_time: 25m
        exp_samples:
          - labels: '{instance="fc:9469"}'
            value: 0
  - name: "Space freed: a scrape outage that leaves no stale marker puts the whole outage's bytes in the slot after it"
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_reclaimed_bytes_total{job="fclones", instance="fc:9469"}'
        values: "0x6 _x5 1000x8"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x6 _x5 0x8"
    promql_expr_test:
      - expr: *space_freed
        eval_time: 15m
        exp_samples:
          - labels: '{instance="fc:9469"}'
            value: 1000

  # The dashboard's Runs by result query, with $instance and its 5m slot filled in.
  # TestDashboardQueriesAreTheTestedOnes fails when the two differ.
  - name: "Runs by result: a slot counts the runs that ended in it, by result"
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_runs_total{job="fclones", instance="fc:9469", result="success"}'
        values: "0+1x30"
      - series: 'fclones_scheduler_runs_total{job="fclones", instance="fc:9469", result="timeout"}'
        values: "0x17 1x13"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x30"
      - series: 'fclones_scheduler_runs_total{job="fclones", instance="other:9469", result="success"}'
        values: "0+3x30"
      - series: 'process_start_time_seconds{job="fclones", instance="other:9469"}'
        values: "0x30"
    promql_expr_test:
      - expr: &runs_by_result 'round(sum by (result) (((last_over_time(fclones_scheduler_runs_total{instance="fc:9469"}[5m]) - last_over_time(fclones_scheduler_runs_total{instance="fc:9469"}[5m] offset 5m)) unless on (instance) ((last_over_time(process_start_time_seconds{instance="fc:9469"}[5m]) != last_over_time(process_start_time_seconds{instance="fc:9469"}[5m] offset 5m)) or (last_over_time(process_start_time_seconds{instance="fc:9469"}[5m]) > time() - 300000 / 1000))) or (last_over_time(fclones_scheduler_runs_total{instance="fc:9469"}[5m]) and on (instance) ((last_over_time(process_start_time_seconds{instance="fc:9469"}[5m]) != last_over_time(process_start_time_seconds{instance="fc:9469"}[5m] offset 5m)) or (last_over_time(process_start_time_seconds{instance="fc:9469"}[5m]) > time() - 300000 / 1000))) or (last_over_time(fclones_scheduler_runs_total{instance="fc:9469"}[5m]) - min_over_time(fclones_scheduler_runs_total{instance="fc:9469"}[5m])))) > 0'
        eval_time: 20m
        exp_samples:
          - labels: '{result="success"}'
            value: 5
          - labels: '{result="timeout"}'
            value: 1
  - name: "Runs by result: a slot with no run draws no bar"
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_runs_total{job="fclones", instance="fc:9469", result="success"}'
        values: "5x40"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x40"
    promql_expr_test:
      - expr: *runs_by_result
        eval_time: 30m
        exp_samples: []
  - name: "Runs by result: a restart counts the startup run even when its total matches the old one"
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_runs_total{job="fclones", instance="fc:9469", result="success"}'
        values: "1x29 1x20"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x29 1770x20"
    promql_expr_test:
      - expr: *runs_by_result
        eval_time: 34m
        exp_samples:
          - labels: '{result="success"}'
            value: 1
  - name: "Runs by result: the slot after a restart draws no bar"
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_runs_total{job="fclones", instance="fc:9469", result="success"}'
        values: "1x29 1x20"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x29 1770x20"
    promql_expr_test:
      - expr: *runs_by_result
        eval_time: 39m
        exp_samples: []
  - name: "Runs by result: a first scrape counts the growth inside the slot, not the lifetime total"
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_runs_total{job="fclones", instance="fc:9469", result="success"}'
        values: "_x29 7 7 8x10"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "_x29 0x12"
    promql_expr_test:
      - expr: *runs_by_result
        eval_time: 34m
        exp_samples:
          - labels: '{result="success"}'
            value: 1
  - name: "Runs by result: a failed scrape at the slot end still counts the run, and the next slot draws no bar"
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_runs_total{job="fclones", instance="fc:9469", result="success"}'
        values: "0x15 1x3 stale 1x10"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x18 stale 0x10"
    promql_expr_test:
      - expr: *runs_by_result
        eval_time: 20m
        exp_samples:
          - labels: '{result="success"}'
            value: 1
      - expr: *runs_by_result
        eval_time: 25m
        exp_samples: []
  - name: "Runs by result: a scrape outage that leaves no stale marker puts the whole outage's runs in the slot after it"
    interval: 1m
    input_series:
      - series: 'fclones_scheduler_runs_total{job="fclones", instance="fc:9469", result="success"}'
        values: "0x6 _x5 3x8"
      - series: 'process_start_time_seconds{job="fclones", instance="fc:9469"}'
        values: "0x6 _x5 0x8"
    promql_expr_test:
      - expr: *runs_by_result
        eval_time: 15m
        exp_samples:
          - labels: '{result="success"}'
            value: 3
