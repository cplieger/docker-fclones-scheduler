# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Runs in external (idle) mode (SCAN_INTERVAL=off):
# runExternal marks the container healthy at boot without running fclones, so no
# scan directory, real duplicates, or external scheduler are needed. Waits for
# the container HEALTHCHECK (the distroless `wrapper health` file-marker probe)
# to report healthy - proving the binary runs on the distroless base, config
# parsing works, the /cache write-preflight passes, and the probe works.
SMOKE_APP_NAME=docker-fclones-scheduler
SMOKE_TIMEOUT=90
# verifyCacheDir write-probes /cache before marking healthy and the container is
# nonroot, so /cache is a world-writable tmpfs (mode 1777).
SMOKE_RUN_ARGS="-e SCAN_INTERVAL=off --tmpfs /cache:size=16m,mode=1777"
