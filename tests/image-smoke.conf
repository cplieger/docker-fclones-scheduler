# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Boots external-trigger mode, then smoke_verify
# triggers a REAL fclones run through the daemon's own socket client against a
# generated fixture holding one byte-identical pair plus one unique file, and
# asserts on the FILESYSTEM that the pair ends up sharing an inode.
#
# The inode assertion is the load-bearing one, not the exit code: fclones exits
# 0 after failing every hardlink it attempted, so a run over an unwritable
# duplicate reports "Processed 0 files and reclaimed 0 B space". The wrapper
# fails such a run, but only by reading that TEXT summary, so a summary it
# cannot parse degrades to a warning and the run passes again. Two hardlinked
# inodes on the host are the one check that survives both.
#
# Constraints that shape the knobs below:
# - The fixture is MUTATED by the run (the duplicate becomes a hardlink), so it
#   is generated per run rather than committed.
# - fclones opens the duplicate for WRITE before linking it, so the files need
#   mode 666 and the directory 777. mktemp makes both 0700 for the runner's
#   user and the container runs as uid 65532.
# - SCAN_TIMEOUT is what bounds the hook: the `scan` client waits on the
#   daemon's result with no deadline of its own.
SMOKE_APP_NAME=docker-fclones-scheduler
# External mode marks the container healthy at boot, inside the image's baked
# 15s start period; 90s is margin for a slow cold boot on a loaded runner.
SMOKE_TIMEOUT=90

SMOKE_FIXTURE=$(mktemp -d)
# Release what the line above acquired: the harness's EXIT trap calls this after
# removing the container, and the fixture failure path below calls it directly
# (the trap is armed only after this file is sourced).
# shellcheck disable=SC2329  # invoked indirectly via the harness EXIT trap
smoke_cleanup() {
  rm -rf "$SMOKE_FIXTURE"
}
# Deterministic content: one byte-identical pair fclones must group, and one
# unique file it must leave alone. 38 bytes is enough, since fclones' --min
# defaults to 1 byte.
if ! printf 'fclones-smoke-duplicate-payload-block\n' >"$SMOKE_FIXTURE/dup-a.bin" \
  || ! cp "$SMOKE_FIXTURE/dup-a.bin" "$SMOKE_FIXTURE/dup-b.bin" \
  || ! printf 'fclones-smoke-unique-payload-block\n' >"$SMOKE_FIXTURE/unique.bin" \
  || ! chmod 777 "$SMOKE_FIXTURE" \
  || ! chmod 666 "$SMOKE_FIXTURE/dup-a.bin" "$SMOKE_FIXTURE/dup-b.bin" "$SMOKE_FIXTURE/unique.bin"; then
  printf 'FAIL: could not write the smoke scan fixture\n' >&2
  smoke_cleanup
  exit 1
fi

# Word-split by the harness; a mktemp path contains no spaces. --network none
# states that neither the wrapper nor fclones needs egress to run a scan.
SMOKE_RUN_ARGS="--network none -e SCAN_INTERVAL=off -e FCLONES_ACTION=link -e SCAN_TIMEOUT=60s -v ${SMOKE_FIXTURE}:/scandir --tmpfs /cache:size=32m,mode=1777"

# Poll the container log for a fixed string. The json-file log driver can lag
# the writer, so a single grep can miss a line the container already wrote.
smoke_wait_for_log() {
  i=0
  while [ "$i" -lt 30 ]; do
    if docker logs "$SMOKE_CONTAINER" 2>&1 | grep -qF -- "$1"; then
      return 0
    fi
    i=$((i + 1))
    sleep 1
  done
  printf 'FAIL: %s\n' "$2" >&2
  return 1
}

smoke_verify() {
  if ! out=$(docker exec "$SMOKE_CONTAINER" /app/wrapper scan 2>&1); then
    printf 'FAIL: the triggered fclones run against the fixture did not exit 0\n' >&2
    printf '%s\n' "$out" >&2
    return 1
  fi
  # The strict JSON decoder produced these totals from a report fclones wrote,
  # so the three of them together prove the scan phase ran AND the report
  # decoded; upstream report drift fails the run instead of zeroing them.
  smoke_wait_for_log 'groups=1 duplicate_files=1 duplicates_found=true' \
    "the run exited 0 but the scan did not report the fixture's one duplicate pair"
  smoke_wait_for_log 'keeper=/scandir/dup-a.bin duplicate=/scandir/dup-b.bin' \
    "the scan reported a duplicate pair that is not the fixture's pair"

  # Filesystem truth, and the assertion that survives a no-op the wrapper
  # cannot see: the pair must now be one inode, and the unique file must be
  # untouched. It runs BEFORE the action-summary poll below so a no-op fails
  # here in zero seconds instead of after 30s of polling for a line that never
  # comes. `stat -c` is GNU coreutils, which the CI runner has.
  ino_a=$(stat -c %i "$SMOKE_FIXTURE/dup-a.bin")
  ino_b=$(stat -c %i "$SMOKE_FIXTURE/dup-b.bin")
  links=$(stat -c %h "$SMOKE_FIXTURE/dup-a.bin")
  if [ "$ino_a" != "$ino_b" ] || [ "$links" != 2 ]; then
    printf 'FAIL: the duplicate pair does not share an inode after the link action (inodes %s/%s, link count %s)\n' \
      "$ino_a" "$ino_b" "$links" >&2
    return 1
  fi
  if [ "$(stat -c %h "$SMOKE_FIXTURE/unique.bin")" != 1 ]; then
    printf 'FAIL: the action linked a file that is not a duplicate; the scan scope is wider than FCLONES_SCAN_PATHS\n' >&2
    return 1
  fi
  # files_deduped comes from the action phase's TEXT summary, the one surviving
  # text surface, so this also fails when upstream rewords "Processed N files
  # and reclaimed X". The inode check above already proved the link, so a
  # failure here means the summary was not recognized.
  smoke_wait_for_log 'action=link duration_s=0 files_deduped=1' \
    "the pair was linked but the action summary was not recognized as one linked file (fclones summary wording drift)"
  if ! docker exec "$SMOKE_CONTAINER" /app/wrapper health; then
    printf 'FAIL: health did not pass after a completed scan\n' >&2
    return 1
  fi

  # The zero-duplicate arm. fclones does not treat hardlinked files as
  # duplicates, so a second run over the same fixture must report a real zero
  # and skip the action. Both lines are POSITIVE evidence of a completed scan,
  # which is what keeps "no duplicates" distinguishable from a broken scan.
  if ! out=$(docker exec "$SMOKE_CONTAINER" /app/wrapper scan 2>&1); then
    printf 'FAIL: the second triggered run over an already-linked fixture did not exit 0\n' >&2
    printf '%s\n' "$out" >&2
    return 1
  fi
  smoke_wait_for_log 'groups=0 duplicate_files=0 duplicates_found=false' \
    "the second run did not report zero duplicates over an already-linked fixture"
  smoke_wait_for_log 'action=link reason=no_duplicates' \
    "the second run reported zero duplicates but did not skip the action"
}
